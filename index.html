<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="shortcut icon" href="/assets/spaceinvaders.png" type="image/x-icon">
</head>

<body>
    <main>
        <section id="start-screen">
            <header>
                <h2>
                    <span class="space-txt">SPACE</span>
                    <span class="invaders-txt">INVADERS</span>
                </h2>
            </header>

            <div class="score-legend">
                <div class="score-row">
                    <img src="assets/red.png" alt="Invaders 1" class="pixel-art">
                    <span>= 10 PTS</span>
                </div>
                <div class="score-row">
                    <img src="assets/yellow.png" alt="Invaders 2" class="pixel-art">
                    <span>= 20 PTS</span>
                </div>
                <div class="score-row">
                    <img src="assets/green.png" alt="Invaders 3" class="pixel-art">
                    <span>= 30 PTS</span>
                </div>
                <div class="score-row">
                    <img src="assets/extra.png" alt="Invaders 4" class="pixel-art">
                    <span>= <span class="mystery-points">?? PTS</span></span>
                </div>

                <div class="play-action">
                    <p>PLAY SPACE INVADERS</p>
                </div>
            </div>
        </section>
        <section id="screen">
            <div class="game-info">
                <div>
                    <span class="info-text">Score:</span>
                    <span class="score">0</span>
                </div>
                <div>
                    <span class="info-text" id="timer-display">00:00</span>
                </div>
                <div class="lives-section">
                    <span class="info-text">Lives:</span>
                    <div id="lives"></div>
                </div>
            </div>
            <div id="game-board">
                <div id="aliens-grid"></div>
                <div id="bunker-container"></div>
                <div id="player-section"></div>
            </div>
            <div id="pause-screen" class="overlay">
                <h1 class="pause-title">PAUSED</h1>
                <div>
                    <button id="btn-continue" class="game-btn">▶ CONTINUE</button>
                    <button id="btn-restart" class="game-btn secondary">↻ RESTART</button>
                </div>
            </div>
            <div id="game-status" class="overlay">
                <h1 class="statu-title">GAME STATUS</h1>
                <div>
                    <button id="btn-play-again" class="game-btn">PLAY AGAIN</button>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js" type="module"></script>
</body>

</html>
